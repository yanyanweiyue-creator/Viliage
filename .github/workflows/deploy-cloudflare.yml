name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the full test suite
        run: npm test

      - name: Apply safe D1 migrations
        run: npx wrangler@4 d1 migrations apply it-takes-a-village-db --remote
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure authenticated Sheets webhooks
        run: |
          test -n "$SHEET_WEBHOOK_SECRET"
          test -n "$USER_SHEET_WEBHOOK_URL"
          test -n "$ERROR_SHEET_WEBHOOK_URL"
          test -n "$FEEDBACK_SHEET_WEBHOOK_URL"
          test -n "$USER_COUNT_SHEET_WEBHOOK_URL"
          test -n "$PASSWORD_EMAIL_WEBHOOK_URL"
          printf '%s' "$SHEET_WEBHOOK_SECRET" | npx wrangler@4 secret put SHEET_WEBHOOK_SECRET
          printf '%s' "$USER_SHEET_WEBHOOK_URL" | npx wrangler@4 secret put USER_SHEET_WEBHOOK_URL
          printf '%s' "$ERROR_SHEET_WEBHOOK_URL" | npx wrangler@4 secret put ERROR_SHEET_WEBHOOK_URL
          printf '%s' "$FEEDBACK_SHEET_WEBHOOK_URL" | npx wrangler@4 secret put FEEDBACK_SHEET_WEBHOOK_URL
          printf '%s' "$USER_COUNT_SHEET_WEBHOOK_URL" | npx wrangler@4 secret put USER_COUNT_SHEET_WEBHOOK_URL
          printf '%s' "$PASSWORD_EMAIL_WEBHOOK_URL" | npx wrangler@4 secret put PASSWORD_EMAIL_WEBHOOK_URL
        env:
          CI: "true"
          SHEET_WEBHOOK_SECRET: ${{ secrets.SHEET_WEBHOOK_SECRET }}
          USER_SHEET_WEBHOOK_URL: ${{ secrets.USER_SHEET_WEBHOOK_URL }}
          ERROR_SHEET_WEBHOOK_URL: ${{ secrets.ERROR_SHEET_WEBHOOK_URL }}
          FEEDBACK_SHEET_WEBHOOK_URL: ${{ secrets.FEEDBACK_SHEET_WEBHOOK_URL }}
          USER_COUNT_SHEET_WEBHOOK_URL: ${{ secrets.USER_COUNT_SHEET_WEBHOOK_URL }}
          PASSWORD_EMAIL_WEBHOOK_URL: ${{ secrets.PASSWORD_EMAIL_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure optional Meeting relay
        run: |
          set -euo pipefail

          if [[ -n "$CLOUDFLARE_TURN_KEY_ID" || -n "$CLOUDFLARE_TURN_API_TOKEN" ]]; then
            test -n "$CLOUDFLARE_TURN_KEY_ID"
            test -n "$CLOUDFLARE_TURN_API_TOKEN"
          fi

          if [[ -n "$MEETING_ICE_SERVERS_JSON" ]]; then
          node --input-type=module <<'NODE'
          const servers = JSON.parse(process.env.MEETING_ICE_SERVERS_JSON);
          if (!Array.isArray(servers)) throw new Error("MEETING_ICE_SERVERS_JSON must be an array.");
          const urls = servers.flatMap((server) => Array.isArray(server?.urls) ? server.urls : [server?.urls]);
          if (!urls.some((url) => /^turns?:/i.test(String(url || "")))) {
            throw new Error("MEETING_ICE_SERVERS_JSON must contain a turn: or turns: URL.");
          }
          NODE
          fi

          if [[ -n "$CLOUDFLARE_TURN_KEY_ID" || -n "$MEETING_ICE_SERVERS_JSON" ]]; then
          node --input-type=module <<'NODE' | npx wrangler@4 secret bulk
          const values = {};
          if (process.env.CLOUDFLARE_TURN_KEY_ID) {
            values.CLOUDFLARE_TURN_KEY_ID = process.env.CLOUDFLARE_TURN_KEY_ID;
            values.CLOUDFLARE_TURN_API_TOKEN = process.env.CLOUDFLARE_TURN_API_TOKEN;
          }
          if (process.env.MEETING_ICE_SERVERS_JSON) {
            values.MEETING_ICE_SERVERS_JSON = process.env.MEETING_ICE_SERVERS_JSON;
          }
          process.stdout.write(JSON.stringify(values));
          NODE
          fi

          npx wrangler@4 secret list --format=json > meeting-secret-list.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const secrets = JSON.parse(readFileSync("meeting-secret-list.json", "utf8"));
          const names = new Set(secrets.map((secret) => secret.name));
          const cloudflareTurn = names.has("CLOUDFLARE_TURN_KEY_ID")
            && names.has("CLOUDFLARE_TURN_API_TOKEN");
          const customTurn = names.has("MEETING_ICE_SERVERS_JSON");
          if (cloudflareTurn || customTurn) {
            console.log("Meeting relay configuration is present.");
          } else {
            console.log(
              "::warning title=Meeting uses STUN only::"
              + "Deployment will continue, but audio, video, and screen sharing may fail "
              + "between restrictive networks until TURN is configured."
            );
          }
          NODE
        env:
          CI: "true"
          CLOUDFLARE_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          CLOUDFLARE_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
          MEETING_ICE_SERVERS_JSON: ${{ secrets.MEETING_ICE_SERVERS_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npx wrangler@4 deploy
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
