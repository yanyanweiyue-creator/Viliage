name: Reset production account data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET-VILLAGE-PRODUCTION to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirmation == 'RESET-VILLAGE-PRODUCTION'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show account count before reset
        run: >-
          npx wrangler@4 d1 execute it-takes-a-village-db --remote
          --command "SELECT COUNT(*) AS accounts_before_reset FROM users"
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Clear account-owned production data
        run: npx wrangler@4 d1 execute it-takes-a-village-db --remote --file=./scripts/reset-production.sql
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production reset
        run: |
          set -euo pipefail
          npx wrangler@4 d1 execute it-takes-a-village-db --remote --json \
            --command "SELECT
            (SELECT COUNT(*) FROM users) AS accounts,
            (SELECT COUNT(*) FROM sessions) AS sessions,
            (SELECT COUNT(*) FROM password_reset_codes) AS password_resets,
            (SELECT COUNT(*) FROM chat_rooms WHERE system_managed = 0) AS user_rooms,
            (SELECT COUNT(*) FROM announcements) AS announcements,
            (SELECT COUNT(*) FROM activities WHERE created_by IS NOT NULL) AS user_activities,
            (SELECT COUNT(*) FROM app_meta
              WHERE substr(key, 1, length('user_count_metrics:')) = 'user_count_metrics:'
            ) AS user_count_metrics" \
            > reset-verification.json

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const payload = JSON.parse(readFileSync("reset-verification.json", "utf8"));
          const statements = Array.isArray(payload) ? payload : [payload];
          const unsuccessful = statements.find((statement) => statement?.success !== true);
          if (unsuccessful) {
            throw new Error(`D1 verification query failed: ${JSON.stringify(unsuccessful)}`);
          }

          const row = statements
            .flatMap((statement) => Array.isArray(statement?.results) ? statement.results : [])
            .at(0);
          if (!row) {
            throw new Error("D1 verification query returned no result row");
          }

          const expectedCounts = [
            "accounts",
            "sessions",
            "password_resets",
            "user_rooms",
            "announcements",
            "user_activities",
            "user_count_metrics",
          ];
          const failures = expectedCounts.filter((name) => {
            const value = Number(row[name]);
            return !Object.hasOwn(row, name) || !Number.isFinite(value) || value !== 0;
          });
          if (failures.length > 0) {
            throw new Error(
              `Production reset left non-zero or invalid counts: ${failures
                .map((name) => `${name}=${JSON.stringify(row[name])}`)
                .join(", ")}`
            );
          }

          console.log("Production reset verified:", row);
          NODE
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
